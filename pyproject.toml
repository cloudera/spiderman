[project]
name = "spiderman"
version = "1.0.0"
description = "A comprehensive, high-quality, human-annotated plain-text dataset for SQL AI tasks across diverse domains and complexity levels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sreenath Somarajapuram", email = "somarajapuram@gmail.com" }]

dependencies = [
    "about-time==4.2.1",
    "alive-progress==3.1.5",
    "annotated-types==0.6.0",
    "certifi==2024.2.2",
    "charset-normalizer==3.3.2",
    "filelock==3.13.3",
    "fsspec==2024.3.1",
    "grapheme==0.6.0",
    "huggingface-hub==0.22.2",
    "idna==3.6",
    "matplotlib>=3.7.0",
    "mysql-connector-python==9.0.0",
    "numpy==2.0.1",
    "openai==2.2.0",
    "packaging==24.0",
    "pandas==2.2.2",
    "pydantic==2.6.4",
    "pydantic-core==2.16.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.1",
    "pyyaml==6.0.1",
    "requests==2.31.0",
    "six==1.16.0",
    "sqlalchemy==2.0.29",
    "sqlalchemy-utils==0.41.2",
    "sqlglot==23.3.0",
    "tqdm==4.66.2",
    "typing-extensions==4.12.2",
    "tzdata==2024.1",
    "urllib3==2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["README.md", "venv", ".venv"]

[tool.ruff.lint]
select = ["C4", "E", "F", "I", "PERF", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["scripts"]

[tool.markdown.lint]
MD013 = false
MD029 = false
MD033 = false
MD041 = false
MD024 = false
